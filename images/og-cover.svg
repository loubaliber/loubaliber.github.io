<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Link-preview cover. Same lab-notebook palette as css/variables.css:
       paper (#faf9f6), ink (#1a1a1a), notebook green (#2f6b4f). -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e4e1da" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#faf9f6"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.7"/>

  <!-- LB monogram (same drawing as images/favicon.svg, scaled) -->
  <g transform="translate(860 150) scale(10)">
    <rect width="32" height="32" rx="6" fill="#faf9f6" stroke="#e4e1da" stroke-width="0.12"/>
    <g fill="#1a1a1a">
      <rect x="7" y="6" width="3.4" height="18.2"/>
      <rect x="5.4" y="6" width="6.6" height="1"/>
      <rect x="5.4" y="23.4" width="13" height="0.9"/>
      <rect x="14.6" y="12.2" width="3.2" height="12.1"/>
    </g>
    <path d="M15.2 13 H20.4 A2.75 2.75 0 0 1 20.4 18.5 H16.6 M16.6 18.5 H21 A2.95 2.95 0 0 1 21 24.4 H15.2" fill="none" stroke="#1a1a1a" stroke-width="1.9"/>
    <circle cx="16.2" cy="18.5" r="1.8" fill="#2f6b4f"/>
  </g>

  <text x="96" y="168" font-family="Menlo, Consolas, monospace" font-size="22" letter-spacing="3"
        fill="#8a867e">CEBU CITY, PHILIPPINES</text>
  <rect x="96" y="196" width="64" height="3" fill="#2f6b4f"/>
  <text x="96" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="88"
        fill="#1a1a1a">Lourenz Baliber</text>
  <text x="96" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic"
        fill="#2f6b4f">Biophysics researcher · Data scientist</text>
  <text x="96" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26"
        fill="#55524c">Particle-tracking microrheology, ML pipelines,</text>
  <text x="96" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26"
        fill="#55524c">and scientific computing.</text>
  <text x="96" y="546" font-family="Menlo, Consolas, monospace" font-size="22"
        fill="#8a867e">loubaliber.github.io</text>
</svg>
