<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      .cvr-bg { fill: #10161d; }
      .cvr-grid { stroke: #212a34; stroke-width: 1; }
      .cvr-a { stroke: #c7ff4d; fill: none; stroke-width: 1.6; stroke-linecap: round; }
      .cvr-a-fill { fill: #c7ff4d; }
      .cvr-b { stroke: #4dd9ff; fill: none; stroke-width: 1.6; stroke-linecap: round; }
      .cvr-b-fill { fill: #4dd9ff; }
      .cvr-dim { stroke: #2e3a46; fill: none; stroke-width: 1; }
    </style>
  </defs>

  <!-- Stroke Detection: EKG pulse through a brain outline -->
  <symbol id="cover-stroke" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <path class="cvr-dim" d="M40 60 C40 30 70 20 100 25 C130 20 165 35 160 65 C158 90 130 100 100 95 C70 100 40 90 40 60 Z"/>
    <path class="cvr-a" d="M10 60 H55 L65 40 L78 82 L90 55 L100 60 H190"/>
    <circle class="cvr-b-fill" cx="65" cy="40" r="3"/>
    <circle class="cvr-b-fill" cx="90" cy="55" r="3"/>
  </symbol>

  <!-- Satellite Orbit Simulator -->
  <symbol id="cover-orbit" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <circle class="cvr-dim" cx="100" cy="60" r="18"/>
    <ellipse class="cvr-a" cx="100" cy="60" rx="85" ry="34"/>
    <ellipse class="cvr-dim" cx="100" cy="60" rx="60" ry="22"/>
    <circle class="cvr-a-fill" cx="184" cy="60" r="3.5"/>
    <circle class="cvr-b-fill" cx="16" cy="60" r="2.5"/>
    <circle class="cvr-dim" cx="100" cy="60" r="0.5"/>
  </symbol>

  <!-- Balibot: chat / bot glyph -->
  <symbol id="cover-bot" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <rect class="cvr-a" x="70" y="30" width="60" height="42" rx="10"/>
    <line class="cvr-a" x1="100" y1="20" x2="100" y2="30"/>
    <circle class="cvr-a-fill" cx="100" cy="16" r="3"/>
    <circle class="cvr-b-fill" cx="86" cy="51" r="4"/>
    <circle class="cvr-b-fill" cx="114" cy="51" r="4"/>
    <path class="cvr-dim" d="M60 90 Q100 105 140 90"/>
    <circle class="cvr-dim" cx="40" cy="60" r="4"/>
    <circle class="cvr-dim" cx="160" cy="60" r="4"/>
  </symbol>

  <!-- Gesture-Controlled Music Engine -->
  <symbol id="cover-gesture" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <path class="cvr-a" d="M50 60 h10 l6 -22 8 44 8 -60 8 76 8 -44 6 22 h46"/>
    <circle class="cvr-b-fill" cx="30" cy="60" r="3"/>
  </symbol>

  <!-- Hydrogel Image Analysis: polymer network mesh -->
  <symbol id="cover-hydrogel" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <g class="cvr-dim">
      <line x1="30" y1="30" x2="80" y2="45"/>
      <line x1="80" y1="45" x2="70" y2="90"/>
      <line x1="80" y1="45" x2="130" y2="35"/>
      <line x1="130" y1="35" x2="160" y2="70"/>
      <line x1="130" y1="35" x2="110" y2="90"/>
      <line x1="70" y1="90" x2="110" y2="90"/>
      <line x1="110" y1="90" x2="160" y2="70"/>
      <line x1="30" y1="30" x2="50" y2="90"/>
      <line x1="50" y1="90" x2="70" y2="90"/>
    </g>
    <circle class="cvr-a-fill" cx="30" cy="30" r="3"/>
    <circle class="cvr-a-fill" cx="80" cy="45" r="3"/>
    <circle class="cvr-b-fill" cx="130" cy="35" r="3"/>
    <circle class="cvr-a-fill" cx="70" cy="90" r="3"/>
    <circle class="cvr-b-fill" cx="110" cy="90" r="3"/>
    <circle class="cvr-a-fill" cx="160" cy="70" r="3"/>
    <circle class="cvr-b-fill" cx="50" cy="90" r="3"/>
  </symbol>

  <!-- Particle Tracking Toolkit -->
  <symbol id="cover-particle" viewBox="0 0 200 120">
    <rect class="cvr-bg" width="200" height="120"/>
    <path class="cvr-a" d="M20 90 C 40 70 30 50 55 55 S 80 30 70 20"/>
    <path class="cvr-b" d="M120 20 C 110 45 140 45 130 70 S 160 100 180 95"/>
    <circle class="cvr-a-fill" cx="70" cy="20" r="3.5"/>
    <circle class="cvr-b-fill" cx="180" cy="95" r="3.5"/>
    <circle class="cvr-dim" cx="20" cy="90" r="2.5"/>
    <circle class="cvr-dim" cx="120" cy="20" r="2.5"/>
  </symbol>
</svg>
